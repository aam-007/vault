<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault</title>
<style>
  :root{
    --fg:#1a1a1a;
    --muted:#6b6b6b;
    --line:#d9d9d9;
    --bg:#ffffff;
    --bg-alt:#f7f7f7;
    --link:#0645ad;
    --link-visited:#551a8b;
    --dash:#eee;
    --mark-bg:#fff3a0;
    --mark-fg:#1a1a1a;
    --font-body:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace;
    --font-head:inherit;
  }

  :root[data-theme="dark"]{
    --fg:#e6e6e6;
    --muted:#8c8c8c;
    --line:#333333;
    --bg:#121212;
    --bg-alt:#1a1a1a;
    --link:#7aa2f7;
    --link-visited:#b48ead;
    --dash:#242424;
    --mark-bg:#5a4a00;
    --mark-fg:#f5e6a0;
  }

  :root[data-theme="grey"]{
    --fg:#e8e8e8;
    --muted:#9a9a9a;
    --line:#4a4a4a;
    --bg:#3a3a3c;
    --bg-alt:#444446;
    --link:#9fc5ff;
    --link-visited:#c9a6e0;
    --dash:#4f4f51;
    --mark-bg:#6b5a00;
    --mark-fg:#f5e6a0;
  }

  :root[data-theme="comfort"]{
    --fg:#3a2f26;
    --muted:#8a7a68;
    --line:#e0d3bd;
    --bg:#f5ecd9;
    --bg-alt:#efe3c9;
    --link:#a15c2f;
    --link-visited:#7d5aa6;
    --dash:#e6d8bf;
    --mark-bg:#e8c874;
    --mark-fg:#3a2f26;
  }

  :root[data-theme="retro"]{
    --fg:#000000;
    --muted:#4d4d4d;
    --line:#7d7d7d;
    --bg:#c0c0c0;
    --bg-alt:#eae6d8;
    --link:#0000ee;
    --link-visited:#551a8b;
    --dash:#bdbdbd;
    --mark-bg:#ffff00;
    --mark-fg:#000000;
    --font-body:"Times New Roman",Times,serif;
    --font-head:"MS Sans Serif","Tahoma",Geneva,sans-serif;
    --header-blue:#000080;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--fg);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    transition:background-color .35s ease, color .35s ease;
  }
  :root[data-theme="retro"] body{
    font-size:16px;
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,0.035) 0px, rgba(0,0,0,0.035) 1px, transparent 1px, transparent 2px);
  }

  a{color:var(--link);text-decoration:none;transition:color .35s ease;}
  a:visited{color:var(--link-visited);}
  a:hover{text-decoration:underline;}

  mark{
    background:var(--mark-bg);
    color:var(--mark-fg);
    padding:0 1px;
    border-radius:2px;
    transition:background-color .35s ease, color .35s ease;
  }

  .wrap{
    max-width:860px;
    margin:0 auto;
    padding:0 16px 64px;
  }
  :root[data-theme="retro"] .wrap{
    max-width:820px;
    margin:22px auto 60px;
    background:var(--bg-alt);
    border:2px solid #000;
    box-shadow:5px 5px 0 #6f6f6f, 6px 6px 0 #000;
    padding:0 0 8px;
  }

  /* elements shown only in the retro theme */
  .retro-only{display:none;}
  :root[data-theme="retro"] .retro-only{display:block;}
  :root[data-theme="retro"] .retro-only.flex{display:flex;}

  /* elements hidden in the retro theme */
  :root[data-theme="retro"] .hide-in-retro{display:none;}

  /* ===== retro window chrome ===== */
  .titlebar{
    background:linear-gradient(180deg,#000080,#1a1a8c 40%,#000060);
    color:#fff;
    font-family:var(--font-head);
    font-size:12px;
    padding:4px 6px;
    align-items:center;
    justify-content:space-between;
    letter-spacing:0.3px;
  }
  .titlebar .name{display:flex;align-items:center;gap:6px;}
  .titlebar .icon{
    width:12px;height:12px;
    background:#ffd955;
    border:1px solid #7a5200;
  }
  .titlebar .buttons{display:flex;gap:3px;}
  .titlebar .buttons span{
    width:14px;height:12px;
    background:#c0c0c0;
    border:1px solid #000;
    border-top-color:#fff;
    border-left-color:#fff;
    display:inline-block;
  }
  .addressbar{
    background:#c0c0c0;
    border-bottom:2px solid #808080;
    padding:4px 8px;
    font-family:var(--font-head);
    font-size:11px;
    color:#000;
    gap:6px;
    align-items:center;
  }
  .addressbar .label{color:#404040;}
  .addressbar .url{
    flex:1;
    background:#fff;
    border:1px solid #404040;
    border-top-color:#000;
    border-left-color:#000;
    padding:2px 6px;
    font-family:"Courier New",monospace;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }

  header{
    padding:28px 0 14px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    transition:border-color .35s ease;
    animation:fadeDown .5s ease both;
  }
  :root[data-theme="retro"] header{
    padding:16px 20px 8px;
    font-family:"Times New Roman",Times,serif;
  }
  header .title{min-width:0;}
  header h1{
    margin:0;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.5px;
  }
  :root[data-theme="retro"] header h1{font-size:19px;}
  header .title .subhead{
    margin:6px 0 0;
    color:var(--muted);
    font-size:12.5px;
  }
  header p{
    margin:6px 0 0;
    color:var(--muted);
    font-size:12.5px;
    transition:color .35s ease;
  }

  /* theme toggle */
  .theme-toggle{
    display:inline-flex;
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
    flex-shrink:0;
    transition:border-color .35s ease;
  }
  :root[data-theme="retro"] .theme-toggle{border-radius:0;}
  .theme-toggle button{
    appearance:none;
    border:none;
    background:var(--bg-alt);
    color:var(--muted);
    font-family:inherit;
    font-size:11.5px;
    letter-spacing:0.3px;
    padding:7px 10px;
    cursor:pointer;
    border-right:1px solid var(--line);
    transition:background-color .25s ease, color .25s ease, border-color .35s ease;
  }
  .theme-toggle button:last-child{border-right:none;}
  .theme-toggle button:hover{color:var(--fg);}
  .theme-toggle button[aria-pressed="true"]{
    background:var(--fg);
    color:var(--bg);
  }
  .theme-toggle button:focus-visible{
    outline:2px solid var(--link);
    outline-offset:-2px;
  }

  .ribbon{
    margin:16px 0 0;
    padding:8px 12px;
    border:1px solid var(--line);
    background:var(--bg-alt);
    color:var(--muted);
    font-size:12.5px;
    white-space:pre-wrap;
    word-break:break-word;
    transition:background-color .35s ease, border-color .35s ease, color .35s ease;
    animation:fadeUp .5s ease .05s both;
  }
  :root[data-theme="retro"] .ribbon{
    margin:0 20px 14px;
    background:var(--bg-alt);
    color:var(--fg);
    font-family:"Courier New",monospace;
    font-size:12px;
    border-top:1px solid #000;
    border-bottom:1px solid #000;
    border-left:none;
    border-right:none;
    letter-spacing:0.3px;
  }
  .ribbon b{color:var(--fg);font-weight:600;transition:color .35s ease;}
  :root[data-theme="retro"] .ribbon b{font-weight:bold;}
  .ribbon .sep{margin:0 8px;color:var(--line);}
  :root[data-theme="retro"] .ribbon .sep{color:#999;}

  /* ===== search bar ===== */
  .searchbar{
    display:flex;
    gap:8px;
    align-items:center;
    margin:12px 0 0;
    flex-wrap:wrap;
  }
  :root[data-theme="retro"] .searchbar{margin:0 20px 0;padding:8px 0;}
  #searchInput{
    flex:1 1 260px;
    min-width:0;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--bg);
    color:var(--fg);
    font-family:inherit;
    font-size:12.5px;
    transition:background-color .35s ease, color .35s ease, border-color .35s ease;
  }
  #searchInput:focus{outline:2px solid var(--link);outline-offset:-1px;}
  #searchInput::placeholder{color:var(--muted);}
  :root[data-theme="retro"] #searchInput{
    border-radius:0;
    border:1px solid #404040;
    border-top-color:#000;
    border-left-color:#000;
    font-family:"Courier New",monospace;
  }
  #clearSearch{
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--bg-alt);
    color:var(--muted);
    cursor:pointer;
    padding:6px 11px;
    font-size:14px;
    line-height:1;
    transition:color .2s ease, border-color .35s ease;
  }
  #clearSearch:hover{color:var(--fg);}
  :root[data-theme="retro"] #clearSearch{border-radius:0;}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;}
  .btn-row button{
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--bg-alt);
    color:var(--muted);
    cursor:pointer;
    padding:6px 10px;
    font-size:11.5px;
    font-family:inherit;
    white-space:nowrap;
    transition:color .2s ease, background-color .2s ease, border-color .35s ease;
  }
  .btn-row button:hover{color:var(--fg);background:var(--bg);}
  :root[data-theme="retro"] .btn-row button{border-radius:0;}
  .search-meta{
    margin:6px 0 0;
    color:var(--muted);
    font-size:11.5px;
    min-height:14px;
    transition:color .35s ease;
  }
  :root[data-theme="retro"] .search-meta{margin:4px 20px 0;font-family:"Courier New",monospace;}
  .search-meta kbd{
    border:1px solid var(--line);
    border-bottom-width:2px;
    border-radius:3px;
    padding:0 4px;
    font-size:10.5px;
    font-family:inherit;
  }

  .content-inner{padding:0 16px;}
  :root[data-theme="retro"] .content-inner{padding:0 20px;}

  .colhead{
    font-family:"Courier New",monospace;
    font-size:12px;
    font-weight:bold;
    color:#000;
    background:#d8d4c4;
    border-top:1px solid #000;
    border-bottom:1px solid #000;
    padding:3px 4px;
    margin:0 20px 4px;
    justify-content:space-between;
  }
  .colhead .c-mod{width:150px;text-align:right;}
  .colhead .c-size{width:70px;text-align:right;}

  section.sem{
    margin-top:26px;
    animation:fadeUp .45s ease both;
  }
  :root[data-theme="retro"] section.sem{margin:16px 20px 0;}
  section.sem > summary{
    cursor:pointer;
    list-style:none;
    font-size:15px;
    font-weight:700;
    padding:6px 0;
    border-bottom:1px solid var(--line);
    transition:border-color .35s ease;
  }
  :root[data-theme="retro"] section.sem > summary{
    background:var(--header-blue);
    color:#fff;
    padding:5px 6px;
    font-family:var(--font-head);
    letter-spacing:0.4px;
    border-bottom:none;
  }
  section.sem > summary::-webkit-details-marker{display:none;}
  section.sem > summary::before{
    content:"▸ ";
    color:var(--muted);
    display:inline-block;
    transition:transform .2s ease, color .35s ease;
  }
  section.sem[open] > summary::before{content:"▾ ";}
  :root[data-theme="retro"] section.sem > summary::before{content:"► ";color:#fff;}
  :root[data-theme="retro"] section.sem[open] > summary::before{content:"▼ ";}

  details.subject{
    margin:2px 0 2px 18px;
    border-left:1px dotted var(--line);
    padding-left:14px;
    transition:border-color .35s ease;
  }
  :root[data-theme="retro"] details.subject{
    margin:0;
    padding-left:0;
    border-left:none;
    border-bottom:1px dashed #999;
  }
  details.subject > summary{
    cursor:pointer;
    list-style:none;
    padding:6px 0;
    color:var(--fg);
    font-weight:600;
    display:flex;
    align-items:center;
    gap:6px;
    transition:color .35s ease;
  }
  :root[data-theme="retro"] details.subject > summary{
    padding:4px 4px 4px 8px;
    background:var(--bg-alt);
    font-family:"Courier New",monospace;
    font-size:13px;
  }
  details.subject > summary::-webkit-details-marker{display:none;}
  details.subject > summary::before{content:"+ ";color:var(--muted);}
  details.subject[open] > summary::before{content:"− ";}
  :root[data-theme="retro"] details.subject > summary::before{content:none;}
  details.subject[open] > ul.files{animation:unfold .25s ease both;}

  details.folder{
    margin:2px 0 2px 18px;
    border-left:1px dotted var(--line);
    padding-left:14px;
    transition:border-color .35s ease;
  }
  :root[data-theme="retro"] details.folder{
    margin:0 0 0 16px;
    padding-left:14px;
    border-left:1px dotted #888;
  }
  details.folder > summary{
    cursor:pointer;
    list-style:none;
    padding:5px 0;
    color:var(--muted);
    font-weight:600;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:6px;
    transition:color .35s ease;
  }
  :root[data-theme="retro"] details.folder > summary{
    padding:3px 4px;
    font-family:"Courier New",monospace;
    font-size:12.5px;
    color:#000;
    font-weight:normal;
  }
  details.folder > summary::-webkit-details-marker{display:none;}
  details.folder > summary::before{content:"▸ ";color:var(--muted);}
  details.folder[open] > summary::before{content:"▾ ";}
  :root[data-theme="retro"] details.folder > summary::before{content:none;}
  details.folder[open] > ul.files{animation:unfold .25s ease both;}

  /* pixel folder / file icons — retro theme only */
  .icon-folder{
    display:none;
    width:16px;height:12px;
    flex-shrink:0;
    position:relative;
    background:#e8b000;
    border:1px solid #7a5200;
  }
  :root[data-theme="retro"] .icon-folder{display:inline-block;image-rendering:pixelated;}
  .icon-folder::before{
    content:"";
    position:absolute;
    top:-3px;left:0;
    width:8px;height:3px;
    background:#e8b000;
    border:1px solid #7a5200;
    border-bottom:none;
  }
  details[open] > summary .icon-folder{background:#ffd042;}

  .icon-file{
    display:none;
    width:12px;height:14px;
    flex-shrink:0;
    background:#fff;
    border:1px solid #555;
    position:relative;
  }
  :root[data-theme="retro"] .icon-file{display:inline-block;}
  .icon-file::after{
    content:"";
    position:absolute;
    top:0;right:0;
    width:0;height:0;
    border-left:4px solid #bbb;
    border-bottom:4px solid #fff;
  }

  ul.files{
    list-style:none;
    margin:0 0 8px;
    padding:0 0 0 18px;
  }
  :root[data-theme="retro"] ul.files{margin:0;padding:0;}
  ul.files li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:3px 0;
    border-bottom:1px dashed var(--dash);
    flex-wrap:wrap;
    transition:border-color .35s ease, background-color .2s ease;
  }
  :root[data-theme="retro"] ul.files li{
    padding:3px 4px 3px 26px;
    font-family:"Courier New",monospace;
    font-size:12.5px;
    border-bottom:1px dotted #ccc;
  }
  :root[data-theme="retro"] ul.files li:nth-child(odd){background:#f0eee2;}
  :root[data-theme="retro"] ul.files li:hover{background:#ffe8a3;}
  ul.files li:hover{background:var(--bg-alt);}
  ul.files li a{
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  ul.files li .meta{
    color:var(--muted);
    font-size:12px;
    white-space:nowrap;
    transition:color .35s ease;
  }
  :root[data-theme="retro"] ul.files li .meta{color:#333;font-size:11.5px;}

  .empty{
    color:var(--muted);
    font-size:12.5px;
    padding:4px 0 8px 18px;
    transition:color .35s ease;
  }
  :root[data-theme="retro"] .empty{
    font-family:"Courier New",monospace;
    padding:5px 4px 8px 30px;
    font-style:italic;
  }

  footer{
    margin-top:40px;
    padding-top:12px;
    border-top:1px solid var(--line);
    color:var(--muted);
    font-size:11.5px;
    transition:border-color .35s ease, color .35s ease;
  }
  :root[data-theme="retro"] footer{
    margin-top:24px;
    border-top:2px solid #000;
    padding:10px 20px 16px;
    font-family:var(--font-head);
    background:var(--bg-alt);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  footer .footcount{padding:0 16px;}
  :root[data-theme="retro"] footer .footcount{padding:0;}

  .error{
    margin:20px 16px 0;
    padding:10px 12px;
    border:1px solid var(--line);
    color:var(--muted);
  }
  :root[data-theme="retro"] .error{
    margin:16px 20px 0;
    border:2px solid #900;
    background:#ffe0e0;
    color:#900;
    font-family:"Courier New",monospace;
    font-size:13px;
  }

  @keyframes fadeDown{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);}}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  @keyframes unfold{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);}}

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.001s !important;
      transition-duration:0.001s !important;
    }
  }

  @media (max-width:480px){
    body{font-size:13px;}
    header h1{font-size:18px;}
    ul.files li{flex-direction:column;gap:2px;}
    .colhead{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="titlebar retro-only flex">
    <div class="name"><span class="icon"></span>/vault/</div>
    <div class="buttons"><span></span><span></span><span></span></div>
  </div>
  <div class="addressbar retro-only flex">
    <span class="label">Location:</span>
    <span class="url">file:///vault/index.html</span>
  </div>

  <div class="content-inner">
    <header>
      <div class="title">
        <h1>vault</h1>
        <p class="subhead hide-in-retro"></p>
      </div>
      <div class="theme-toggle" role="group" aria-label="Theme">
        <button type="button" data-theme-btn="light" aria-pressed="true">light</button>
        <button type="button" data-theme-btn="dark" aria-pressed="false">dark</button>
        <button type="button" data-theme-btn="grey" aria-pressed="false">grey</button>
        <button type="button" data-theme-btn="comfort" aria-pressed="false">comfort</button>
        <button type="button" data-theme-btn="retro" aria-pressed="false">retro</button>
      </div>
    </header>

    <div class="ribbon" id="ribbon">loading manifest…</div>

    <div class="searchbar" id="searchbar" style="display:none;">
      <input type="text" id="searchInput" placeholder="search files… e.g. ext:pdf sem:sem_3 subj:dsa size:&gt;1M after:2026-07-01 &quot;lab 1&quot;" autocomplete="off" spellcheck="false">
      <button type="button" id="clearSearch" title="Clear search (Esc)">&times;</button>
      <div class="btn-row">
        <button type="button" id="expandAll">expand all</button>
        <button type="button" id="collapseAll">collapse all</button>
      </div>
    </div>
    <div class="search-meta" id="searchMeta"></div>

    <div class="colhead retro-only flex">
      <span class="c-name">Name</span>
      <span class="c-mod">Last modified</span>
      <span class="c-size">Size</span>
    </div>

    <div id="tree"></div>

    <footer id="footer">
      <span class="footcount"></span>
    </footer>
  </div>
</div>

<script>
(function initTheme(){
  const THEMES = ["light", "dark", "grey", "comfort", "retro"];
  const root = document.documentElement;
  let saved = "light";
  try{
    saved = localStorage.getItem("vault-theme") || "light";
  }catch(e){}
  if(!THEMES.includes(saved)) saved = "light";
  applyTheme(saved);

  function applyTheme(theme){
    if(theme === "light"){
      root.removeAttribute("data-theme");
    }else{
      root.setAttribute("data-theme", theme);
    }
    document.querySelectorAll("[data-theme-btn]").forEach(btn => {
      btn.setAttribute("aria-pressed", btn.dataset.themeBtn === theme ? "true" : "false");
    });
    try{ localStorage.setItem("vault-theme", theme); }catch(e){}
  }

  document.addEventListener("click", function(e){
    const btn = e.target.closest("[data-theme-btn]");
    if(!btn) return;
    applyTheme(btn.dataset.themeBtn);
  });
})();

// --- flattened file index (built once from manifest) --------------------

let ALL_FILES = [];

function parseSizeToBytes(s){
  if(!s) return null;
  const m = String(s).trim().match(/^([\d.]+)\s*([KMGT]?)B?$/i);
  if(!m) return null;
  const num = parseFloat(m[1]);
  const unit = m[2].toUpperCase();
  const mult = {"": 1, K: 1024, M: 1024 ** 2, G: 1024 ** 3, T: 1024 ** 4}[unit] || 1;
  return num * mult;
}

function flattenManifest(tree){
  const out = [];
  for(const sem of Object.keys(tree)){
    for(const subj of Object.keys(tree[sem])){
      for(const f of tree[sem][subj]){
        const folder = f.folder || "";
        const dotIdx = f.name.lastIndexOf(".");
        const ext = dotIdx > -1 ? f.name.slice(dotIdx + 1).toLowerCase() : "";
        const haystack = [sem, subj, folder, f.name].filter(Boolean).join("/").toLowerCase();
        out.push({
          sem, subj, folder,
          name: f.name,
          path: f.path,
          size_human: f.size_human,
          modified: f.modified,
          sizeBytes: parseSizeToBytes(f.size_human),
          ext, haystack
        });
      }
    }
  }
  return out;
}

// --- search query parsing ------------------------------------------------

function parseQuery(query){
  const terms = [];
  const filters = [];
  const tokenRe = /"([^"]+)"|\/((?:\\.|[^/])+)\/|(\S+)/g;
  let m;
  while((m = tokenRe.exec(query))){
    if(m[1] !== undefined){
      const phrase = m[1].toLowerCase();
      if(phrase){ terms.push(phrase); filters.push(f => f.haystack.includes(phrase)); }
    }else if(m[2] !== undefined){
      let rx;
      try{ rx = new RegExp(m[2], "i"); }catch(e){ continue; }
      filters.push(f => rx.test(f.name));
    }else if(m[3]){
      const tok = m[3];
      const kv = tok.match(/^(\w+):(.+)$/);
      if(kv){
        const key = kv[1].toLowerCase();
        const val = kv[2];
        if(key === "ext"){
          const ext = val.toLowerCase().replace(/^\./, "");
          filters.push(f => f.ext === ext);
        }else if(key === "sem"){
          const v = val.toLowerCase();
          filters.push(f => f.sem.toLowerCase().includes(v));
        }else if(key === "subj" || key === "in"){
          const v = val.toLowerCase();
          filters.push(f => f.subj.toLowerCase().includes(v));
        }else if(key === "size"){
          const opMatch = val.match(/^(>=|<=|>|<)?(.+)$/);
          const op = opMatch[1];
          const bytes = parseSizeToBytes(opMatch[2]);
          if(op && bytes !== null){
            filters.push(f => {
              if(f.sizeBytes === null) return false;
              if(op === ">") return f.sizeBytes > bytes;
              if(op === "<") return f.sizeBytes < bytes;
              if(op === ">=") return f.sizeBytes >= bytes;
              return f.sizeBytes <= bytes;
            });
          }else{
            const v = val.toLowerCase();
            filters.push(f => (f.size_human || "").toLowerCase().includes(v));
          }
        }else if(key === "before" || key === "after"){
          const d = new Date(val);
          if(!isNaN(d)){
            filters.push(f => {
              const fd = new Date(f.modified);
              if(isNaN(fd)) return false;
              return key === "before" ? fd < d : fd > d;
            });
          }
        }else{
          const v = tok.toLowerCase();
          terms.push(v);
          filters.push(f => f.haystack.includes(v));
        }
      }else{
        const v = tok.toLowerCase();
        terms.push(v);
        filters.push(f => f.haystack.includes(v));
      }
    }
  }
  return {
    terms,
    predicate: filters.length ? (f => filters.every(fn => fn(f))) : null
  };
}

function highlightInto(el, text, terms){
  if(!terms.length){ el.textContent = text; return; }
  const esc = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).filter(Boolean);
  if(!esc.length){ el.textContent = text; return; }
  const rx = new RegExp("(" + esc.join("|") + ")", "ig");
  let lastIndex = 0;
  let match;
  while((match = rx.exec(text))){
    if(match.index > lastIndex) el.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
    const mark = document.createElement("mark");
    mark.textContent = match[0];
    el.appendChild(mark);
    lastIndex = match.index + match[0].length;
    if(match[0].length === 0) rx.lastIndex++;
  }
  if(lastIndex < text.length) el.appendChild(document.createTextNode(text.slice(lastIndex)));
}

// --- folder-tree helpers -----------------------------------------------

function buildFolderTree(files){
  const root = { files: [], folders: {} };
  for(const f of files){
    if(!f.folder){
      root.files.push(f);
      continue;
    }
    const parts = f.folder.split('/').filter(Boolean);
    let node = root;
    for(const part of parts){
      if(!node.folders[part]){
        node.folders[part] = { files: [], folders: {} };
      }
      node = node.folders[part];
    }
    node.files.push(f);
  }
  return root;
}

function countFilesInNode(node){
  let n = node.files.length;
  for(const key of Object.keys(node.folders)){
    n += countFilesInNode(node.folders[key]);
  }
  return n;
}

function buildFileList(files, terms){
  const ul = document.createElement('ul');
  ul.className = 'files';
  for(const f of files){
    const li = document.createElement('li');

    const icon = document.createElement('span');
    icon.className = 'icon-file';
    li.appendChild(icon);

    const a = document.createElement('a');
    a.href = f.path;
    highlightInto(a, f.name, terms);
    li.appendChild(a);

    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = (f.size_human || '') + '  ' + shortDate(f.modified);
    li.appendChild(meta);

    ul.appendChild(li);
  }
  return ul;
}

function renderFolderNode(node, parentEl, forceOpen, terms){
  if(node.files.length){
    parentEl.appendChild(buildFileList(node.files, terms));
  }
  const folderNames = Object.keys(node.folders).sort();
  for(const name of folderNames){
    const subNode = node.folders[name];
    const folderEl = document.createElement('details');
    folderEl.className = 'folder';
    folderEl.open = forceOpen;
    const summary = document.createElement('summary');
    const icon = document.createElement('span');
    icon.className = 'icon-folder';
    summary.appendChild(icon);
    const label = document.createElement('span');
    label.textContent = name + '  (' + countFilesInNode(subNode) + ')';
    summary.appendChild(label);
    folderEl.appendChild(summary);
    renderFolderNode(subNode, folderEl, forceOpen, terms);
    parentEl.appendChild(folderEl);
  }
}

// --- tree rendering (shared by default view and search results) --------

function renderTree(files, isSearching, terms){
  const treeEl = document.getElementById('tree');
  treeEl.innerHTML = '';

  if(!files.length){
    treeEl.innerHTML = '<div class="error">no files match your search.</div>';
    return;
  }

  const bySem = {};
  for(const f of files){
    if(!bySem[f.sem]) bySem[f.sem] = {};
    if(!bySem[f.sem][f.subj]) bySem[f.sem][f.subj] = [];
    bySem[f.sem][f.subj].push(f);
  }

  const semesters = Object.keys(bySem).sort();
  let semIndex = 0;
  for(const sem of semesters){
    const semEl = document.createElement('details');
    semEl.className = 'sem';
    semEl.open = isSearching;
    semEl.style.animationDelay = (0.08 + semIndex * 0.05) + 's';
    semIndex++;
    const semSummary = document.createElement('summary');
    semSummary.textContent = sem;
    semEl.appendChild(semSummary);

    const subjects = Object.keys(bySem[sem]).sort();
    for(const subj of subjects){
      const subjEl = document.createElement('details');
      subjEl.className = 'subject';
      subjEl.open = isSearching;
      const subjSummary = document.createElement('summary');
      const icon = document.createElement('span');
      icon.className = 'icon-folder';
      subjSummary.appendChild(icon);
      const subjFiles = bySem[sem][subj];
      const label = document.createElement('span');
      label.textContent = subj + '  (' + subjFiles.length + ')';
      subjSummary.appendChild(label);
      subjEl.appendChild(subjSummary);

      const rootNode = buildFolderTree(subjFiles);
      renderFolderNode(rootNode, subjEl, isSearching, terms);
      semEl.appendChild(subjEl);
    }
    treeEl.appendChild(semEl);
  }
}

// --- search wiring --------------------------------------------------------

function applyFilter(query){
  const searchMeta = document.getElementById('searchMeta');
  const trimmed = query.trim();
  if(!trimmed){
    renderTree(ALL_FILES, false, []);
    searchMeta.textContent = '';
    document.getElementById('clearSearch').style.visibility = 'hidden';
    return;
  }
  document.getElementById('clearSearch').style.visibility = 'visible';
  const { terms, predicate } = parseQuery(trimmed);
  const filtered = predicate ? ALL_FILES.filter(predicate) : ALL_FILES;
  renderTree(filtered, true, terms);
  searchMeta.textContent = filtered.length + ' of ' + ALL_FILES.length + ' file(s) match';
}

function setupSearchUI(){
  const bar = document.getElementById('searchbar');
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearSearch');
  const expandBtn = document.getElementById('expandAll');
  const collapseBtn = document.getElementById('collapseAll');
  bar.style.display = 'flex';
  clearBtn.style.visibility = 'hidden';

  let debounceTimer = null;
  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => applyFilter(input.value), 120);
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    applyFilter('');
    input.focus();
  });

  expandBtn.addEventListener('click', () => {
    document.querySelectorAll('#tree details').forEach(d => { d.open = true; });
  });
  collapseBtn.addEventListener('click', () => {
    document.querySelectorAll('#tree details').forEach(d => { d.open = false; });
  });

  document.addEventListener('keydown', (e) => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if(e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA'){
      e.preventDefault();
      input.focus();
    }else if(e.key === 'Escape' && document.activeElement === input){
      input.value = '';
      applyFilter('');
      input.blur();
    }
  });
}

// -------------------------------------------------------------------------

async function main(){
  const treeEl = document.getElementById('tree');
  const ribbonEl = document.getElementById('ribbon');
  const footcountEl = document.querySelector('#footer .footcount');

  let data;
  try{
    const res = await fetch('manifest.json', {cache:'no-store'});
    if(!res.ok) throw new Error('manifest not found (' + res.status + ')');
    data = await res.json();
  }catch(err){
    ribbonEl.remove();
    treeEl.innerHTML = '<div class="error">manifest.json not found or unreadable. run runner.py and commit vault/manifest.json.</div>';
    return;
  }

  const recent = data.recent_file;
  const generated = data.generated_at ? fmtDate(data.generated_at) : '—';
  let ribbonHTML = '<b>last updated:</b> ' + generated;
  if(recent){
    ribbonHTML += '<span class="sep">|</span><b>recent upload:</b> ' + recent.path;
  }
  ribbonEl.innerHTML = ribbonHTML;

  ALL_FILES = flattenManifest(data.tree || {});

  if(ALL_FILES.length === 0){
    treeEl.innerHTML = '<div class="error">no semesters found in manifest.</div>';
  }else{
    setupSearchUI();
    renderTree(ALL_FILES, false, []);
    document.getElementById('searchMeta').innerHTML =
      'tip: press <kbd>/</kbd> to search — supports ext:, sem:, subj:, size:&gt;1M, before:/after:YYYY-MM-DD, "phrases", /regex/';
  }

  if(footcountEl){
    const semCount = new Set(ALL_FILES.map(f => f.sem)).size;
    footcountEl.textContent = ALL_FILES.length + ' file(s) — ' + semCount + ' semester(s) — for support: aditya.mishra10@nmims.in';
  }
}

function fmtDate(iso) {
  try {
    const d = new Date(iso);
    return new Intl.DateTimeFormat("en-IN", {
      timeZone: "Asia/Kolkata",
      year: "numeric",
      month: "short",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false,
    }).format(d) + " IST";
  } catch (e) {
    return iso;
  }
}

function shortDate(iso) {
  try {
    const d = new Date(iso);
    return new Intl.DateTimeFormat("en-IN", {
      timeZone: "Asia/Kolkata",
      year: "numeric",
      month: "short",
      day: "2-digit",
    }).format(d);
  } catch (e) {
    return "";
  }
}

main();
</script>
